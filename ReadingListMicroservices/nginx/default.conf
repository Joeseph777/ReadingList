# Single entry point for everything: serves the static web app, and routes
# API calls to the right backend container by path prefix. Both FastAPI
# services already namespace their own routes (/auth/... and /books/...),
# so no path rewriting is needed here — just forward as-is.
#
# Only this container needs to be reachable from the internet; AuthService
# and LibraryService are never exposed directly (see docker-compose.yml —
# they have no `ports:` mapping, only the internal Docker network).

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    location /auth/ {
        proxy_pass http://auth:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /books/ {
        proxy_pass http://library:8001/books/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
